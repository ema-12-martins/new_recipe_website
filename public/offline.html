<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Livro de Receitas da Família</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #292524;
        background: #fafaf9;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(100% - 2rem, 48rem); margin: 0 auto; padding: 1rem 0 3rem; }
      [role="status"] { padding: 1rem; border: 1px solid #a8a29e; border-radius: .5rem; }
      h1 { margin: 1.5rem 0; overflow-wrap: anywhere; }
      h2 { margin-top: 2rem; }
      li { margin-block: .5rem; overflow-wrap: anywhere; white-space: pre-wrap; }
      a { color: #166534; }
      .recipe-link { display: block; padding: 1rem 0; }
    </style>
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <main id="offline-content"></main>
  </body>
</html>
